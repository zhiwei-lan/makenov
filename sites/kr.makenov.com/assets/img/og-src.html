<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  /* OG 이미지 원본 (1200×630) — assets/img/og.png 렌더용. 수정 후 헤드리스 크롬으로 재캡처 */
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;overflow:hidden;font-family:Pretendard,sans-serif;
    background:#0B1220;position:relative;color:#fff}
  .grid{position:absolute;inset:0;
    background-image:linear-gradient(rgba(39,202,161,.07) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(39,202,161,.07) 1px,transparent 1px);
    background-size:44px 44px}
  .glow{position:absolute;right:-120px;top:-160px;width:560px;height:560px;border-radius:50%;
    background:radial-gradient(circle,rgba(39,202,161,.28),transparent 65%)}
  .glow2{position:absolute;left:-80px;bottom:-220px;width:480px;height:480px;border-radius:50%;
    background:radial-gradient(circle,rgba(0,151,224,.22),transparent 65%)}
  .box{position:absolute;left:96px;top:150px}
  .logo{font-size:64px;font-weight:800;letter-spacing:2px}
  .logo b{color:#27CAA1}
  .tag{margin-top:28px;font-size:34px;font-weight:600;line-height:1.45;color:#E7ECF3}
  .sub{margin-top:18px;font-size:22px;color:#8A94A6}
  .chips{position:absolute;left:96px;bottom:88px;display:flex;gap:12px}
  .chip{border:1px solid rgba(39,202,161,.5);color:#27CAA1;font-size:18px;font-weight:600;
    padding:10px 22px;border-radius:4px}
</style>
</head>
<body>
  <div class="grid"></div><div class="glow"></div><div class="glow2"></div>
  <div class="box">
    <div class="logo">MAKE<b>NOV</b></div>
    <div class="tag">Nền tảng B2B sản phẩm sáng tạo toàn cầu<br>Global Innovation, Verified Distribution partners</div>
    <div class="sub">Xác thực doanh nghiệp · Báo giá trực tiếp · Tiếng Việt / 한국어 / English</div>
  </div>
  <div class="chips"><span class="chip">B2B Sourcing</span><span class="chip">Verified</span><span class="chip">makenov</span></div>
</body>
</html>
