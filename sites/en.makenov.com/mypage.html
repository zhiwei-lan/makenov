<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="assets/css/style.css?v=20260817b">
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
<!-- mk:seo (bake.js가 관리 — 직접 수정 금지) -->
<title>Trang của tôi | MAKENOV</title>
<meta name="robots" content="noindex,nofollow">
<!-- /mk:seo -->
</head>
<body>
<header class="mk-header" id="mk-header"></header>

<main class="wrap">
  <!-- 계정 요약 — 로그인 상태에서만 채워진다 -->
  <div id="my-summary"></div>

  <div class="tabs" id="my-tabs">
    <button class="on" data-tab="wish" onclick="showTab('wish')"><span data-i18n="my_wishlist"></span><i class="cnt" id="cnt-wish"></i></button>
    <button data-tab="inq" onclick="showTab('inq')"><span data-i18n="my_inquiries"></span><i class="cnt" id="cnt-inq"></i></button>
    <button data-tab="profile" onclick="showTab('profile')"><span data-i18n="my_profile"></span></button>
  </div>

  <section id="tab-wish"></section>
  <section id="tab-inq" style="display:none"></section>
  <section id="tab-profile" style="display:none"></section>
</main>

<footer class="mk-footer" id="mk-footer"></footer>
<script src="assets/js/config.js?v=20260817b"></script>
<script src="assets/js/pixel.js?v=20260817b"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/js/i18n.js?v=20260819f"></script>
<script src="assets/js/baked.js?v=20260817b"></script>
<script src="assets/js/data.js?v=20260819c"></script>
<script src="assets/js/copy.js?v=20260817b"></script>
<script src="assets/js/store.js?v=20260817b"></script>
<script src="assets/js/verify.js?v=20260817b"></script>
<script src="assets/js/upload.js?v=20260817b"></script>
<script src="assets/js/store-supabase.js?v=20260819d"></script>
<script src="assets/js/copy-edit.js?v=20260817b"></script>
<script src="assets/js/app.js?v=20260819d"></script>
<script>
function showTab(name){
  document.querySelectorAll('.tabs button').forEach(b=>{
    b.classList.toggle('on', b.dataset.tab===name);
    b.blur();                                   // 클릭 후 검은 포커스 테두리가 남지 않게
  });
  ['wish','inq','profile'].forEach(x=>document.getElementById('tab-'+x).style.display = x===name?'block':'none');
}

/* 값이 없을 때 빈칸으로 두면 고장난 것처럼 보인다 — '미입력'으로 명시한다 */
function val(v){ return v ? esc(v) : `<span class="unset" data-i18n="my_unset"></span>`; }

/* 문의 처리 상태 */
const INQ_STATUS = {
  new:     { key:'my_st_new',  cls:'st-new'  },
  working: { key:'my_st_work', cls:'st-work' },
  done:    { key:'my_st_done', cls:'st-done' },
};

function renderSummary(s){
  const el = document.getElementById('my-summary');
  if(!s){ el.innerHTML = `<div class="page-head"><h1 data-i18n="mypage"></h1></div>`; return; }
  const vip = s.tier === 'vip';
  el.innerHTML = `
    <div class="my-top"><div class="my-id"><h1>${val(s.company)}</h1><div class="my-meta">${esc(s.email)}${s.countryName?` · ${esc(s.countryName)}`:''}</div><div class="my-badges"><span class="badge-verified"><span data-i18n="my_verified"></span></span>${vip?`<span class="badge-vip">VIP</span>`:''}</div></div><div class="my-acts"><a class="btn btn-soft btn-sm" href="directory.html" data-i18n="hero_cta_browse"></a><button class="btn btn-ghost btn-sm" onclick="Store.logout();location.href='index.html'" data-i18n="logout"></button></div></div>`;
}

/* ---------- 관심제품 ---------- */
function renderWish(){
  const cart = Store.cart().map(mkProduct).filter(Boolean);
  document.getElementById('cnt-wish').textContent = cart.length || '';
  document.getElementById('tab-wish').innerHTML = cart.length ? `
    <div class="bulkbar"><button class="btn btn-primary" onclick="openInquiry(${JSON.stringify(cart.map(p=>p.id)).replace(/"/g,"'")})" data-i18n="inq_bulk"></button></div>
    ${cart.map(p=>`
      <div class="list-item"><a href="product.html?id=${p.id}"><img src="${p.img}" alt=""></a><div class="grow"><a href="product.html?id=${p.id}"><h3>${esc(L(p.name))}</h3></a><div class="sub">${esc(p.brand)} · ${esc(p.origin)}</div><div class="sub">${p.inquiries} <span data-i18n="inquiries_count"></span></div></div><div class="acts"><button class="btn btn-soft btn-sm" onclick="openInquiry(['${p.id}'])" data-i18n="cta_inquiry"></button><button class="icon-x" title="remove" onclick="Store.cartRemove('${p.id}');renderWish();applyI18n();updateCartBadge()"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div></div>`).join('')}` :
    `<div class="empty"><p data-i18n="my_empty_wish"></p><div style="margin-top:18px"><a class="btn btn-primary" href="directory.html" data-i18n="hero_cta_browse"></a></div></div>`;
  applyI18n(document.getElementById('tab-wish'));
}

/* ---------- 내 문의 ----------
   ⚠️ Supabase 모드에서 myInquiries()는 async 다. 예전엔 동기로 호출해서
   Promise 의 .length 가 undefined 가 되는 바람에 문의가 있어도 늘 비어 보였다. */
async function renderInq(){
  const inqs = (await Store.myInquiries()) || [];
  document.getElementById('cnt-inq').textContent = inqs.length || '';
  document.getElementById('tab-inq').innerHTML = inqs.length ? inqs.map(i=>{
    const p = mkProduct(i.pid);
    const st = INQ_STATUS[i.status] || INQ_STATUS.new;
    const d = new Date(i.createdAt);
    /* 행을 클릭하면 펼쳐져서 보낸 내용 전문과 시각(시·분)까지 보인다 */
    return `<div class="list-item inq-row" onclick="this.classList.toggle('open')">
      ${p?`<a href="product.html?id=${p.id}" onclick="event.stopPropagation()"><img src="${p.img}" alt=""></a>`:''}
      <div class="grow"><a href="${p?`product.html?id=${p.id}`:'#'}" onclick="event.stopPropagation()"><h3>${p?esc(L(p.name)):esc(i.pid)}</h3></a>
        <div class="sub"><span class="dt-d">${d.toLocaleDateString()}</span><span class="dt-full">${d.toLocaleString([], {year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}</span></div>
        ${i.message?`<p class="inq-msg">${esc(i.message)}</p>`:''}
      </div><div class="acts"><span class="st ${st.cls}" data-i18n="${st.key}"></span><svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></div></div>`;}).join('')
    : `<div class="empty"><p data-i18n="my_empty_inq"></p><div style="margin-top:18px"><a class="btn btn-primary" href="directory.html" data-i18n="hero_cta_browse"></a></div></div>`;
  applyI18n(document.getElementById('tab-inq'));
}

/* ---------- 기업 프로필 ---------- */
function renderProfile(){
  const s = Store.session();
  const el = document.getElementById('tab-profile');
  if(!s){
    el.innerHTML = `<div class="empty"><p data-i18n="auth_need"></p><div style="margin-top:18px"><button class="btn btn-primary" onclick="openAuth('signup')" data-i18n="signup"></button></div></div>`;
    applyI18n(el); return;
  }
  const c = s.country ? mkCountry(s.country) : null;
  el.innerHTML = `
    <div class="pf-grid"><div class="pf-box"><div class="pf-head"><h3 data-i18n="my_pf_company"></h3><button class="btn btn-ghost btn-sm" onclick="reverify()" data-i18n="my_pf_reverify"></button></div><div class="pf-row"><b data-i18n="auth_company"></b><span>${val(s.company)}</span></div><div class="pf-row"><b data-i18n="auth_country"></b><span>${c?c.flag+' ':''}${val(s.countryName)}</span></div><div class="pf-row"><b data-i18n="auth_brn"></b><span>${val(s.regNo||s.mst)}</span></div><div class="pf-row"><b data-i18n="auth_address"></b><span>${val(s.address)}</span></div><p class="pf-note" data-i18n="my_pf_locked"></p></div><div class="pf-box"><div class="pf-head"><h3 data-i18n="my_pf_contact"></h3><button class="btn btn-ghost btn-sm" onclick="editProfile()" data-i18n="my_pf_edit"></button></div><div class="pf-row"><b data-i18n="auth_contact_name"></b><span>${val(s.contactName)}</span></div><div class="pf-row"><b data-i18n="auth_position"></b><span>${val(s.position)}</span></div><div class="pf-row"><b data-i18n="auth_phone"></b><span>${val(s.phone)}</span></div><div class="pf-row"><b data-i18n="auth_email"></b><span>${esc(s.email)}</span></div></div></div>`;
  applyI18n(el);
}

/* 기업 정보 재인증 — 가입 때 인증이 비었거나(스킵 계정) 정보가 바뀐 경우.
   가입 모달의 인증 UI(su-country/su-verify/v-result)를 그대로 재사용한다 —
   suCountryChange()/runVerify()가 이 id 들을 찾아 동작한다(app.js). */
function reverify(){
  const s = Store.session();
  _verified = null;
  _suCountry = s.country || (MK_LANG==='ko' ? 'KR' : 'VN');
  mkModal(`
    <h2 data-i18n="my_pf_reverify"></h2>
    <p class="sub" data-i18n="my_pf_reverify_sub"></p>
    <div class="f-row"><label data-i18n="auth_country"></label>
      <select id="su-country" onchange="suCountryChange(this.value)">
        ${MK_COUNTRIES.map(c=>`<option value="${c.code}">${c.flag} ${esc(L(c.name))}</option>`).join('')}
      </select></div>
    <div id="su-verify"></div>
    <div class="mst-result" id="v-result" style="display:none"></div>
    <!-- suCountryChange 가 채우는 전화 필드 — 이 모달엔 없어서 숨김으로만 둔다 -->
    <input id="su-dial" type="hidden"><input id="su-phone" type="hidden">
    <button class="btn btn-primary btn-block" onclick="reverifyDone()" data-i18n="my_pf_save"></button>`);
  const sel = document.getElementById('su-country');
  if(sel) sel.value = _suCountry;
  suCountryChange(_suCountry);
}
async function reverifyDone(){
  if(!_verified){ toast(t('auth_need_verify')); return; }
  const btn = document.querySelector('#mk-modal-back .btn-primary');
  if(btn) btn.disabled = true;
  const res = await Store.reverify(_verified);
  if(btn) btn.disabled = false;
  if(!res || !res.ok){ toast(t('auth_mst_fail')); return; }
  closeModal(); toast(t('my_pf_saved'));
  renderProfile(); renderSummary(Store.session()); renderChrome();
}

/* 담당자 정보만 수정 — 회사·사업자번호는 인증으로 확정된 값이라 못 바꾼다 */
function editProfile(){
  const s = Store.session();
  mkModal(`
    <h2 data-i18n="my_pf_edit"></h2>
    <p class="sub" data-i18n="my_pf_edit_sub"></p>
    <div class="f-2col">
      <div class="f-row"><label data-i18n="auth_contact_name"></label><input id="pf-name" value="${esc(s.contactName||'')}"></div>
      <div class="f-row"><label data-i18n="auth_position"></label><input id="pf-pos" value="${esc(s.position||'')}"></div>
    </div>
    <div class="f-row"><label data-i18n="auth_phone"></label><input id="pf-tel" inputmode="tel" value="${esc(s.phone||'')}"></div>
    <button class="btn btn-primary btn-block" onclick="saveProfile()" data-i18n="my_pf_save"></button>`);
}
async function saveProfile(){
  const v = id => document.getElementById(id).value.trim();
  if(!v('pf-name')){ toast(t('auth_need_basic')); return; }
  const btn = document.querySelector('#mk-modal-back .btn-primary');
  if(btn) btn.disabled = true;
  const res = await Store.updateProfile({ contactName:v('pf-name'), position:v('pf-pos'), phone:v('pf-tel') });
  if(btn) btn.disabled = false;
  if(!res || !res.ok){ toast(t('inq_err')); return; }
  closeModal(); toast(t('my_pf_saved'));
  renderProfile(); renderSummary(Store.session()); renderChrome();
}

function pageInit(){
  const s = Store.session();
  renderSummary(s);
  renderWish();
  renderInq();
  renderProfile();
}
</script>
</body>
</html>
