<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hướng dẫn | Cộng tác viên MAKENOV</title>
<meta name="description" content="Cách kiếm hoa hồng với MAKENOV: đăng link sản phẩm Hàn Quốc lên TikTok, Facebook, Zalo. Tính thu nhập, bài mẫu, quy định.">
<link rel="canonical" href="https://vn.makenov.com/affiliate/guide.html">
<link rel="stylesheet" href="../assets/css/style.css?v=20260909b">
<link rel="stylesheet" href="affiliate.css?v=20260909h">
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
</head>
<body class="aff-body">
<div class="aff-app">
  <aside class="aff-side" id="aff-side"></aside>
  <div class="aff-main">
    <div class="aff-top" id="aff-top"></div>
    <main class="aff-content">
      <section class="aff-guide-hero">
        <h1 data-i18n="g_h1"></h1>
        <p data-i18n="g_p"></p>
        <div class="cta" id="hero-cta" style="display:flex;gap:8px;flex-wrap:wrap"></div>
      </section>

      <section class="aff-sec" id="how">
        <div class="aff-sec-head"><h2 data-i18n="g_how"></h2></div>
        <div class="aff-stats three">
          <div class="aff-stat step"><span class="n">1</span><h3 data-i18n="g_s1"></h3><p data-i18n="g_s1p"></p></div>
          <div class="aff-stat step"><span class="n">2</span><h3 data-i18n="g_s2"></h3><p data-i18n="g_s2p"></p></div>
          <div class="aff-stat step"><span class="n">3</span><h3 data-i18n="g_s3"></h3><p data-i18n="g_s3p"></p></div>
        </div>
      </section>

      <section class="aff-sec" id="channels">
        <div class="aff-sec-head"><h2 data-i18n="g_ch"></h2></div>
        <div class="aff-channels">
          <div class="ch"><span class="lg tiktok">TikTok</span><h3 data-i18n="g_c1"></h3><p data-i18n="g_c1p"></p></div>
          <div class="ch"><span class="lg fb">Facebook</span><h3 data-i18n="g_c2"></h3><p data-i18n="g_c2p"></p></div>
          <div class="ch"><span class="lg zalo">Zalo</span><h3 data-i18n="g_c3"></h3><p data-i18n="g_c3p"></p></div>
          <div class="ch"><span class="lg yt">YouTube · Web</span><h3 data-i18n="g_c4"></h3><p data-i18n="g_c4p"></p></div>
        </div>
      </section>

      <section class="aff-sec" id="calc">
        <div class="aff-calc">
          <div>
            <h2 data-i18n="g_calc"></h2>
            <p data-i18n="g_calc_p"></p>
            <label class="calc-row"><span data-i18n="g_calc_n"></span><b id="calc-n">10</b></label>
            <input type="range" id="calc-range" min="1" max="60" value="10" oninput="calc()">
            <label class="calc-row"><span data-i18n="g_calc_cpa"></span><select id="calc-cpa" onchange="calc()"><option value="200000" selected>200.000 ₫</option></select></label>
          </div>
          <div class="calc-out">
            <div class="lb" data-i18n="g_month"></div>
            <div class="v" id="calc-month">2.000.000 ₫</div>
            <div class="lb2" id="calc-year"></div>
            <a class="btn btn-primary btn-lg" href="join.html" id="calc-cta" data-i18n="g_start"></a>
          </div>
        </div>
      </section>

      <section class="aff-sec" id="sample">
        <div class="aff-sec-head"><h2 data-i18n="g_sample"></h2><a class="more" href="index.html" data-i18n="g_all"></a></div>
        <div class="aff-sample">
          <div class="post" id="post-card"></div>
          <div class="side">
            <h3 data-i18n="g_nowrite"></h3>
            <p data-i18n="g_nowrite_p"></p>
            <a class="btn btn-ghost" href="index.html" data-i18n="g_sample_btn"></a>
          </div>
        </div>
      </section>

      <section class="aff-sec" id="rules">
        <div class="aff-sec-head"><h2 data-i18n="g_rules"></h2></div>
        <div class="aff-box">
          <p class="aff-rules" data-i18n="g_rules_text"></p>
          <div class="aff-warn" data-i18n="g_warn"></div>
        </div>
      </section>

      <section class="aff-sec" id="faq">
        <div class="aff-sec-head"><h2 data-i18n="g_faq"></h2></div>
        <div class="faq-list">
          <details class="faq-item"><summary data-i18n="q1"></summary><div class="a" data-i18n="a1"></div></details>
          <details class="faq-item"><summary data-i18n="q2"></summary><div class="a" data-i18n="a2"></div></details>
          <details class="faq-item"><summary data-i18n="q3"></summary><div class="a" data-i18n="a3"></div></details>
          <details class="faq-item"><summary data-i18n="q4"></summary><div class="a" data-i18n="a4"></div></details>
          <details class="faq-item"><summary data-i18n="q5"></summary><div class="a" data-i18n="a5"></div></details>
        </div>
      </section>

      <section class="aff-final">
        <h2 data-i18n="g_final"></h2>
        <p data-i18n="g_final_p"></p>
        <div class="cta" id="final-cta"></div>
      </section>
    </main>
    <footer class="aff-foot" id="aff-foot"></footer>
  </div>
</div>
<script src="../assets/js/config.js?v=20260817b"></script>
<script src="aff-i18n.js?v=20260909h"></script>
<script src="aff-api.js?v=20260909h"></script>
<script src="aff-demo.js?v=20260909h"></script>
<script src="aff.js?v=20260909h"></script>
<script>
function calc(){
  const n = Number(document.getElementById('calc-range').value), cpa = Number(document.getElementById('calc-cpa').value);
  document.getElementById('calc-n').textContent = n;
  document.getElementById('calc-month').textContent = vnd(n * cpa);
  document.getElementById('calc-year').textContent = t('g_year', { v: vnd(n * cpa * 12) });
}
affBoot(location.hash === '#calc' ? 'calc' : location.hash === '#rules' ? 'rules' : 'guide', { titleKey:'guide_title' }, async () => {
  const m = AffApi.session();
  const ctas = m ? `<a class="btn btn-primary btn-lg" href="index.html">${t('see_campaigns')}</a><a class="btn btn-ghost btn-lg" href="my.html">${t('my')}</a>`
                 : `<a class="btn btn-primary btn-lg" href="join.html">${t('banner_cta')}</a><a class="btn btn-ghost btn-lg" href="index.html">${t('see_campaigns')}</a>`;
  document.getElementById('hero-cta').innerHTML = ctas; document.getElementById('final-cta').innerHTML = ctas;
  if(m) document.getElementById('calc-cta').href = 'index.html';
  calc();
  const all = await AffApi.campaigns({});
  if(all.length){
    const cpas = all.map(c => c.cpa_vnd), lo = Math.min(...cpas), hi = Math.max(...cpas);
    const r = document.getElementById('hero-range'); if(r) r.textContent = lo === hi ? vnd(hi) : `${lo.toLocaleString('vi-VN')}–${hi.toLocaleString('vi-VN')} ₫`;
    const sel = document.getElementById('calc-cpa'), uniq = [...new Set(cpas)].sort((a, b) => a - b);
    sel.innerHTML = uniq.map(v => `<option value="${v}">${vnd(v)}</option>`).join(''); sel.value = String(uniq[Math.floor(uniq.length / 2)]);
    const c = all.find(x => x.featured) || all[0];
    const link = affLink(m ? m.code : 'XXXXXX', c.product_id);
    const text = `${c.copy_text}\n\n${t('view_price')} ${link}`;
    document.getElementById('post-card').innerHTML = `
      <div class="ph"><span class="av"></span><div><b>${esc(m ? m.name : t('your_name'))}</b><span>${t('just_now')}</span></div></div>
      <div class="pt">${esc(c.copy_text)}<br><br>${t('view_price')} <a>${esc(link)}</a></div>
      <img src="${esc(c.img)}" alt="${esc(c.name)}" loading="lazy">
      <div class="pf"><span>${esc(c.brand)} · ${esc(c.name)}</span><button class="btn btn-primary btn-sm" onclick="copyText(${JSON.stringify(text)})">${t('copy_post')}</button></div>`;
    calc();
  } else { document.getElementById('sample').style.display = 'none'; }
  if(location.hash){ const el = document.querySelector(location.hash); if(el) setTimeout(() => el.scrollIntoView({ block:'start' }), 50); }
});
</script>
</body>
</html>
