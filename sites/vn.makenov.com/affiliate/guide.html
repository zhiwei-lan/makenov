<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hướng dẫn bắt đầu | Cộng tác viên MAKENOV</title>
<meta name="description" content="Từ đăng ký đến lần rút tiền đầu tiên: chọn chiến dịch, lấy link, đăng lên Facebook, Zalo, TikTok, nhận hoa hồng khi khách hàng được duyệt.">
<link rel="canonical" href="https://vn.makenov.com/affiliate/guide.html">
<link rel="stylesheet" href="../assets/css/style.css?v=20260909b">
<link rel="stylesheet" href="affiliate.css?v=20260909m">
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
</head>
<body class="aff-body">
<div class="aff-app">
  <aside class="aff-side" id="aff-side"></aside>
  <div class="aff-main">
    <div class="aff-top" id="aff-top"></div>
    <main class="aff-content">
      <section class="aff-guide-hero">
        <h1 data-i18n="gd_h1"></h1>
        <p data-i18n="gd_p"></p>
      </section>

      <div class="gd-steps">
        <section class="gd-step"><span class="n">1</span><div><h2 data-i18n="gd1_h"></h2><p data-i18n="gd1_p"></p><a class="btn btn-primary btn-sm" href="join.html" data-i18n="join_btn" id="gd-join"></a></div></section>
        <section class="gd-step"><span class="n">2</span><div><h2 data-i18n="gd2_h"></h2><p data-i18n="gd2_p"></p><a class="btn btn-ghost btn-sm" href="campaigns.html" data-i18n="menu_campaigns"></a></div></section>
        <section class="gd-step"><span class="n">3</span><div><h2 data-i18n="gd3_h"></h2><p data-i18n="gd3_p"></p></div></section>
        <section class="gd-step"><span class="n">4</span><div><h2 data-i18n="gd4_h"></h2>
          <div class="aff-channels" style="margin-top:12px">
            <div class="ch"><span class="lg fb">Facebook</span><p data-i18n="gd4_fb"></p></div>
            <div class="ch"><span class="lg zalo">Zalo</span><p data-i18n="gd4_zalo"></p></div>
            <div class="ch"><span class="lg tiktok">TikTok</span><p data-i18n="gd4_tt"></p></div>
          </div></div></section>
        <section class="gd-step"><span class="n">5</span><div><h2 data-i18n="gd5_h"></h2><p data-i18n="gd5_p"></p></div></section>
        <section class="gd-step"><span class="n">6</span><div><h2 data-i18n="gd6_h"></h2><p data-i18n="gd6_p"></p></div></section>
      </div>

      <section class="aff-sec">
        <div class="aff-sec-head"><h2 data-i18n="gd_tip_h"></h2></div>
        <div class="aff-stats three">
          <div class="aff-stat step"><span class="n">✓</span><p data-i18n="gd_t1"></p></div>
          <div class="aff-stat step"><span class="n">✓</span><p data-i18n="gd_t2"></p></div>
          <div class="aff-stat step"><span class="n">✓</span><p data-i18n="gd_t3"></p></div>
        </div>
      </section>

      <section class="aff-final">
        <h2 data-i18n="lp_final"></h2>
        <p data-i18n="lp_final_p"></p>
        <div class="cta" id="final-cta"></div>
      </section>
    </main>
    <footer class="aff-foot" id="aff-foot"></footer>
  </div>
</div>
<script src="../assets/js/config.js?v=20260817b"></script>
<script src="aff-i18n.js?v=20260909m"></script>
<script src="aff-api.js?v=20260909m"></script>
<script src="aff.js?v=20260909m"></script>
<script>
affBoot('guide', { titleKey:'menu_guide' }, () => {
  const m = AffApi.session();
  document.getElementById('final-cta').innerHTML = m
    ? `<a class="btn btn-primary btn-lg" href="campaigns.html">${t('gd_cta')}</a>`
    : `<a class="btn btn-primary btn-lg" href="join.html">${t('lp_cta')}</a><a class="btn btn-ghost btn-lg" href="campaigns.html">${t('gd_cta')}</a>`;
  if(m){ const j = document.getElementById('gd-join'); j.textContent = t('my'); j.href = 'my.html'; }
});
</script>
</body>
</html>
