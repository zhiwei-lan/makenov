<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập cộng tác viên | MAKENOV</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../assets/css/style.css?v=20260909b">
<link rel="stylesheet" href="affiliate.css?v=20260909d">
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
</head>
<body>
<header class="mk-header" id="mk-header"></header>

<main class="wrap">
  <form class="aff-form" onsubmit="return submitLogin(event)">
    <h1>Đăng nhập</h1>
    <p class="sub">Tài khoản cộng tác viên MAKENOV</p>
    <div class="f-row"><label>Email</label><input id="email" type="email" required autocomplete="email"></div>
    <div class="f-row"><label>Mật khẩu</label><input id="pw" type="password" required autocomplete="current-password"></div>
    <button class="btn btn-primary btn-block btn-lg" id="btn" type="submit">Đăng nhập</button>
    <p class="foot"><a href="#" onclick="toast('Liên hệ Zalo hỗ trợ 0901 234 567 để đặt lại mật khẩu');return false">Quên mật khẩu?</a> · Chưa có tài khoản? <a href="join.html" id="join-link">Đăng ký</a></p>
  </form>
</main>

<footer class="mk-footer" id="mk-footer"></footer>
<script src="../assets/js/config.js?v=20260817b"></script>
<script src="aff-mock.js?v=20260909c"></script>
<script src="aff.js?v=20260909c"></script>
<script>
async function submitLogin(e){
  e.preventDefault();
  const b = document.getElementById('btn'); b.disabled = true;
  try{
    await AffApi.login(document.getElementById('email').value.trim(), document.getElementById('pw').value);
    location.href = qs('next') || 'my.html';
  }catch(err){ toast(err.message); b.disabled = false; }
  return false;
}
affBoot('', () => {
  if(AffApi.session()){ location.replace(qs('next') || 'my.html'); return; }
  if(qs('next')) document.getElementById('join-link').href = 'join.html?next=' + encodeURIComponent(qs('next'));
});
</script>
</body>
</html>
