<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trang của tôi | Cộng tác viên MAKENOV</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../assets/css/style.css?v=20260909b">
<link rel="stylesheet" href="affiliate.css?v=20260910o">
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
</head>
<body class="aff-body">
<div class="aff-app">
  <aside class="aff-side" id="aff-side"></aside>
  <div class="aff-main">
    <div class="aff-top" id="aff-top"></div>
    <main class="aff-content">
      <div class="aff-my-top" id="my-top"></div>
      <div class="tabs aff" id="my-tabs">
        <button class="on" data-tab="dash" onclick="showTab('dash')"><span data-i18n="tab_dash"></span></button>
        <button data-tab="leads" onclick="showTab('leads')"><span data-i18n="tab_leads"></span><i class="cnt" id="cnt-leads"></i></button>
        <button data-tab="money" onclick="showTab('money')"><span data-i18n="tab_money"></span></button>
        <button data-tab="account" onclick="showTab('account')"><span data-i18n="tab_account"></span></button>
      </div>
      <section id="tab-dash"></section>
      <section id="tab-leads" style="display:none"></section>
      <section id="tab-money" style="display:none"></section>
      <section id="tab-account" style="display:none"></section>
    </main>
    <footer class="aff-foot" id="aff-foot"></footer>
  </div>
</div>
<script src="../assets/js/config.js?v=20260817b"></script>
<script src="aff-i18n.js?v=20260910o"></script>
<script src="aff-api.js?v=20260910o"></script>
<script src="aff.js?v=20260910o"></script>
<script>
let ME = null, SUM = null, leadFilter = '';
const v = id => document.getElementById(id).value.trim();
function showTab(name){
  document.querySelectorAll('.tabs button').forEach(b => { b.classList.toggle('on', b.dataset.tab === name); b.blur(); });
  ['dash','leads','money','account'].forEach(x => document.getElementById('tab-' + x).style.display = x === name ? 'block' : 'none');
  history.replaceState(null, '', '#' + name);
}
async function drawTop(){
  ME = await AffApi.me(); SUM = await AffApi.summary();
  const link = affLink(ME.code);
  document.getElementById('my-top').innerHTML = `
    <div><h1>${esc(ME.name)}</h1><div class="meta">${t('code')} <b>${esc(ME.code)}</b> · ${esc(ME.email)} · ${t('member_since')} ${fmtDate(ME.created_at)}</div></div>
    <div style="min-width:min(100%,420px)"><div style="font-size:13px;font-weight:600;color:#4E5968">${t('my_link')}</div>
      <div class="aff-linkbox"><input readonly value="${esc(link)}" onclick="this.select()"><button class="btn btn-primary btn-sm" onclick="copyText(${JSON.stringify(link)})">${t('copy')}</button></div>
      <p class="aff-note" style="margin-top:6px">${t('my_link_note')}</p></div>`;
  document.getElementById('cnt-leads').textContent = SUM.leads.pending || '';
  const sb = document.getElementById('aff-side-bal'); if(sb) sb.textContent = vnd(SUM.balance_vnd);
}
async function drawDash(){
  const [cf, leads] = await Promise.all([AffApi.clicksFull(30), AffApi.leads({})]);
  const clicks = cf.days || [], chs = Object.entries(cf.channels || {}).sort((a, b) => b[1] - a[1]);
  const max = Math.max(1, ...clicks.map(c => c.clicks));
  document.getElementById('tab-dash').innerHTML = `
    <div class="aff-stats">
      <div class="aff-stat"><div class="lb">${t('st_clicks')}</div><div class="v">${SUM.clicks30}</div></div>
      <div class="aff-stat"><div class="lb">${t('st_pending')}</div><div class="v">${SUM.leads.pending}</div></div>
      <div class="aff-stat"><div class="lb">${t('st_approved')}</div><div class="v">${SUM.leads.approved}<small>/ ${SUM.leads.approved + SUM.leads.pending + SUM.leads.rejected}</small></div></div>
      <div class="aff-stat"><div class="lb">${t('st_balance')}</div><div class="v" style="color:#13A583">${vnd(SUM.balance_vnd)}</div></div>
    </div>
    <div class="aff-box aff-ratebox"><div><h3>${t('st_rate')}</h3><p class="aff-note" style="margin:0">${t('st_rate_note')}</p></div>
      <div class="big">${SUM.approval_rate == null ? `<span class="na">${t('rate_na')}</span>` : `<b>${Math.round(SUM.approval_rate * 100)}%</b>${rateChip(SUM.approval_rate).replace(t('rate_short', { p: Math.round(SUM.approval_rate * 100) }), gradeOf(SUM.approval_rate))}`}</div></div>
    <div class="aff-box"><h3>${t('clicks_h')}</h3>
      <div class="aff-bars">${clicks.map(c => `<i style="height:${Math.round(c.clicks / max * 100)}%" data-v="${c.clicks}" title="${c.day}: ${c.clicks}"></i>`).join('')}</div>
      <div class="aff-bars-lb"><span>${clicks.length ? clicks[0].day : ''}</span><span>${clicks.length ? clicks[clicks.length - 1].day : ''}</span></div>
      ${chs.length ? `<p class="aff-note">${t('by_ch')} ${chs.map(([k, n]) => `<b>${esc(chName(k))}</b> ${n}`).join(' · ')}</p>` : ''}</div>
    <div class="aff-box"><h3>${t('recent_h')}</h3>${leadTable(leads.slice(0, 5))}
      <p class="aff-note"><a href="#leads" onclick="showTab('leads');return false">${t('see_all')}</a></p></div>`;
}
function leadTable(rows){
  if(!rows.length) return `<div class="aff-empty">${t('no_leads')}</div>`;
  return `<div class="aff-table-wrap"><table class="aff-table"><thead><tr><th>${t('th_date')}</th><th>${t('th_product')}</th><th>${t('th_status')}</th><th class="num">${t('th_amount')}</th></tr></thead><tbody>
    ${rows.map(l => `<tr><td style="white-space:nowrap">${fmtDate(l.created_at)}</td><td><a href="campaign.html?id=${esc(l.product_id)}">${esc(AFF_LANG === 'ko' && l.product_name_ko ? l.product_name_ko : l.product_name)}</a>${l.reject_reason ? `<span class="sub">${t('reason')} ${esc(l.reject_reason)}</span>` : ''}</td><td>${stBadge(l.status)}</td><td class="num">${l.status === 'rejected' ? '—' : vnd(l.amount_vnd)}</td></tr>`).join('')}
  </tbody></table></div>`;
}
async function drawLeads(){
  const rows = await AffApi.leads({ status: leadFilter });
  const chips = [['', 'f_all'], ['pending', 'f_pending'], ['approved', 'f_approved'], ['rejected', 'f_rejected']];
  document.getElementById('tab-leads').innerHTML = `<div class="aff-box">
    <div class="subtabs" style="margin-bottom:14px">${chips.map(([k, key]) => `<button class="${leadFilter === k ? 'on' : ''}" onclick="leadFilter='${k}';drawLeads()">${t(key)}</button>`).join('')}</div>
    ${leadTable(rows)}<p class="aff-note">${t('leads_note')}</p></div>`;
}
async function drawMoney(){
  const ws = await AffApi.withdrawals();
  const hasBank = ME.bank_account && ME.bank_holder;
  document.getElementById('tab-money').innerHTML = `
    <div class="aff-two">
      <div class="aff-box"><h3>${t('balance_h')}</h3>
        <div class="aff-bal"><b>${vnd(SUM.balance_vnd)}</b><span>${t('withdrawable')}</span></div>
        <p class="aff-note">${t('bal_note', { a: vnd(SUM.approved_vnd), w: vnd(SUM.withdrawn_vnd) })}</p>
        <div class="f-row" style="margin-top:18px"><label>${t('wd_amount')}</label><input id="wd-amt" type="number" min="${SUM.min_withdraw}" step="1000" placeholder="${SUM.min_withdraw.toLocaleString('vi-VN')}" ${hasBank ? '' : 'disabled'}></div>
        <button class="btn btn-primary btn-block" onclick="requestWd()" ${hasBank ? '' : 'disabled'}>${t('wd_btn')}</button>
        <p class="aff-note">${hasBank ? t('wd_note', { bank: esc(ME.bank_name), acc: esc(ME.bank_account), holder: esc(ME.bank_holder), min: vnd(SUM.min_withdraw) }) : t('wd_need_bank')}</p>
      </div>
      <div class="aff-box"><h3>${t('wd_hist')}</h3>
        ${ws.length ? `<table class="aff-table"><thead><tr><th>${t('th_date')}</th><th class="num">${t('th_amt')}</th><th>${t('th_status')}</th></tr></thead><tbody>${ws.map(w => `<tr><td>${fmtDate(w.created_at)}${w.paid_at ? `<span class="sub">${t('wd_paid', { d: fmtDate(w.paid_at) })}</span>` : ''}${w.memo ? `<span class="sub">${esc(w.memo)}</span>` : ''}</td><td class="num">${vnd(w.amount_vnd)}</td><td>${stBadge(w.status)}</td></tr>`).join('')}</tbody></table>` : `<p class="aff-note">${t('no_wd')}</p>`}
      </div>
    </div>`;
}
async function requestWd(){ try{ await AffApi.requestWithdrawal(v('wd-amt')); toast(t('wd_sent')); await drawTop(); drawMoney(); }catch(e){ toast(e.message); } }
function drawAccount(){
  const f = (id, label, val, type) => `<div class="f-row"><label>${label}</label><input id="${id}" type="${type || 'text'}" value="${esc(val || '')}"></div>`;
  document.getElementById('tab-account').innerHTML = `
    <div class="aff-two">
      <div>
        <div class="aff-box"><h3>${t('acc_info')}</h3>
          <div class="f-row"><label>${t('email')}</label><input value="${esc(ME.email)}" readonly></div>
          ${f('ac-name', t('name'), ME.name)}${f('ac-phone', t('phone'), ME.phone, 'tel')}${f('ac-zalo', t('zalo'), ME.zalo)}<div class="f-row"><label>${t('channel')}</label>${channelsEditor('ac-channels', ME.channels || [], false)}</div>
          <button class="btn btn-primary" onclick="saveInfo()">${t('save')}</button></div>
        <div class="aff-box"><h3>${t('pw_change')}</h3>
          ${f('pw-old', t('pw_old'), '', 'password')}${f('pw-new', t('pw_new'), '', 'password')}
          <button class="btn btn-ghost" onclick="savePw()">${t('pw_change')}</button></div>
      </div>
      <div class="aff-box"><h3>${t('bank_h')}</h3>
        <div class="f-row"><label>${t('bank_name')}</label>${bankSelect('bk-name', ME.bank_name)}</div>${f('bk-acc', t('bank_acc'), ME.bank_account)}${f('bk-holder', t('bank_holder'), ME.bank_holder)}
        <button class="btn btn-primary" onclick="saveBank()">${t('bank_save')}</button>
        <p class="aff-note">${t('bank_note')}</p></div>
    </div>`;
}
async function saveInfo(){ try{ ME = await AffApi.updateMe({ name:v('ac-name'), phone:v('ac-phone'), zalo:v('ac-zalo'), channels:channelsRead('ac-channels') }); toast(t('saved')); drawTop(); affSidebar('account'); }catch(e){ toast(e.message); } }
async function saveBank(){ try{ ME = await AffApi.updateMe({ bank_name:bankValue('bk-name'), bank_account:v('bk-acc'), bank_holder:v('bk-holder').toUpperCase() }); toast(t('bank_saved')); drawMoney(); }catch(e){ toast(e.message); } }
async function savePw(){ try{ await AffApi.changePassword(v('pw-old'), v('pw-new')); toast(t('pw_changed')); drawAccount(); }catch(e){ toast(e.message); } }
affBoot('account', { titleKey:'my_title' }, async () => {
  if(!affGuard()) return;
  await drawTop();
  await Promise.all([drawDash(), drawLeads(), drawMoney()]); drawAccount();
  const h = location.hash.replace('#', '');
  if(['dash','leads','money','account'].includes(h)) showTab(h);
});
</script>
</body>
</html>
