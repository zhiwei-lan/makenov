name: Deploy PHP Website to 1Panel

on:
  push:
    branches: [main]
  # bake.yml(자동 굽기)이 굽기 커밋을 푸시한 뒤 직접 호출한다.
  # 왜: GITHUB_TOKEN 으로 한 푸시는 on:push 를 깨우지 않아
  #     구운 칼럼이 레포에만 있고 서버에 안 올라가던 사고(2026-09-04).
  workflow_call: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to 1Panel Server
        uses: appleboy/ssh-action@v1.0.3
        env:
          META_CAPI_TOKEN: ${{ secrets.META_CAPI_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_KEY }}
          port: 2218
          # 비밀값은 레포에 두지 않는다 — GitHub 시크릿 → 배포 때 서버 .env 에 써 넣는다
          envs: META_CAPI_TOKEN
          script: |
            echo "===== 开始部署 makenov0001 ====="
            cd /opt/1panel/www/sites/makenov.vigo.co.kr/index
            git config --global --add safe.directory /opt/1panel/www/sites/makenov.vigo.co.kr/index 2>/dev/null || true
            git pull origin main
            # Meta 전환 API 토큰(시크릿 META_CAPI_TOKEN) → .env 의 makenov.metaCapiToken 갱신
            # ⚠ 2026-09-15 장애: sed -i / mv 는 .env 를 새 inode 로 재생성해 소유자·권한이
            #   deploy 유저 것(600)으로 바뀌고, PHP-FPM(다른 유저)이 못 읽어 DotEnv 가 boot 에서
            #   throw → 전 라우트 500. 반드시 (1) 같은 inode 에 덮어써 원 파일을 유지하고
            #   (2) 이미 깨진 .env 의 권한을 PHP 가 읽는 레포 파일(composer.json) 기준으로 복구한다.
            if [ -n "$META_CAPI_TOKEN" ]; then
              T=$(printf '%s' "$META_CAPI_TOKEN" | tr -d '[:space:]"'"'"'')
              if [ -f .env ]; then
                # 기존 줄 제거 + 새 줄 추가한 내용을 같은 inode 의 .env 에 그대로 덮어쓴다(> 는 truncate, inode 유지)
                { grep -v '^makenov.metaCapiToken' .env; echo "makenov.metaCapiToken = \"$T\""; } > .env.tmp \
                  && cat .env.tmp > .env && rm -f .env.tmp || echo "WARN: .env 토큰 기록 실패"
                # 이전 sed -i 배포가 남긴 잘못된 권한을 PHP 가 읽는 레포 파일 기준으로 복구
                chmod --reference=composer.json .env 2>/dev/null || chmod 644 .env 2>/dev/null || true
                chown --reference=composer.json .env 2>/dev/null || true
                grep -c '^makenov.metaCapiToken' .env || true
                ls -l .env composer.json || true
              fi
            fi
            composer install --no-dev --optimize-autoloader --no-interaction 2>/dev/null || echo "WARN: composer install 失败"
            rm -rf writable/cache/* writable/debugbar/* 2>/dev/null || true
            chmod -R 775 writable/ 2>/dev/null || true
            echo "===== makenov 部署完成 ====="
