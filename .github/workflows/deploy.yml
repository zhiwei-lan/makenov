name: Deploy PHP Website to 1Panel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to 1Panel Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_KEY }}
          port: 2218
          script: |
            echo "===== 开始部署 makenov0001 ====="
            cd /opt/1panel/www/sites/makenov.vigo.co.kr/index
            git config --global --add safe.directory /opt/1panel/www/sites/makenov.vigo.co.kr/index 2>/dev/null || true
            git pull origin main
            composer install --no-dev --optimize-autoloader --no-interaction 2>/dev/null || echo "WARN: composer install 失败"
            rm -rf writable/cache/* writable/debugbar/* 2>/dev/null || true
            chmod -R 775 writable/ 2>/dev/null || true
            echo "===== makenov 部署完成 ====="
