name: Deploy PHP Website to 1Panel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to 1Panel Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_KEY }}
          port: 2218
          script: |
            echo "===== 开始部署 makenov 01010====="
            cd /opt/1panel/www/sites/makenov.vigo.co.kr/index
            git config --global --add safe.directory /opt/1panel/www/sites/makenov.vigo.co.kr/index 2>/dev/null || true
            git pull origin main

            echo "===== composer install ====="
            if command -v composer >/dev/null 2>&1; then
              composer install --no-dev --optimize-autoloader --no-interaction
            elif [ -f composer.phar ]; then
              php composer.phar install --no-dev --optimize-autoloader --no-interaction
            else
              echo "ERROR: composer가 서버에 없습니다. deploy 계정 PATH에 composer를 설치하세요."
              exit 1
            fi

            rm -rf writable/cache/* writable/debugbar/* 2>/dev/null || true
            chmod -R 775 writable/ 2>/dev/null || true

            # PHP는 컨테이너 안에서 다른 UID로 돌아 group 권한이 통하지 않는다.
            # deploy가 이 폴더 소유자라 root 없이 열 수 있다 — 소유자를 바꾸지
            # 않으므로 git pull도 계속 동작한다. PHP UID 확인 후 2775로 조일 것.
            echo "===== uploads 쓰기 권한 ====="
            mkdir -p public/uploads
            chmod -R 777 public/uploads
            ls -ld public/uploads public/uploads/2026 2>/dev/null || true

            echo "===== makenov 部署完成 ====="
