<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="견적 요청서">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04143F"/>
      <stop offset="0.62" stop-color="#022E7D"/>
      <stop offset="1" stop-color="#0B45B4"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#27CAA1"/>
      <stop offset="1" stop-color="#3AD8B4"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0v44" fill="none" stroke="#fff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <circle cx="1080" cy="120" r="260" fill="#32D1B1" fill-opacity=".10"/>

  <!-- 견적 요청서 카드 -->
  <g transform="translate(150 118)">
    <rect x="0" y="0" width="480" height="440" rx="18" fill="#fff" fill-opacity=".97"/>
    <rect x="40" y="44" width="150" height="13" rx="6.5" fill="#27CAA1"/>
    <rect x="40" y="84" width="272" height="19" rx="9.5" fill="#212529" fill-opacity=".82"/>

    <!-- 채워진 항목 -->
    <g fill="#212529" fill-opacity=".13">
      <rect x="40" y="146" width="96" height="11" rx="5.5"/>
      <rect x="40" y="200" width="96" height="11" rx="5.5"/>
      <rect x="40" y="254" width="96" height="11" rx="5.5"/>
      <rect x="40" y="308" width="96" height="11" rx="5.5"/>
    </g>
    <g fill="#212529" fill-opacity=".55">
      <rect x="176" y="144" width="120" height="15" rx="7.5"/>
      <rect x="176" y="198" width="168" height="15" rx="7.5"/>
      <rect x="176" y="252" width="96" height="15" rx="7.5"/>
      <rect x="176" y="306" width="204" height="15" rx="7.5"/>
    </g>
    <g stroke="#E9ECEF" stroke-width="1">
      <path d="M40 176h400M40 230h400M40 284h400M40 338h400"/>
    </g>

    <!-- 보내기 버튼 -->
    <rect x="40" y="366" width="400" height="42" rx="6" fill="url(#mint)"/>
  </g>

  <!-- 체크 3개 = 수량·시기·서류 -->
  <g transform="translate(720 210)">
    <g fill="none" stroke="#32D1B1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="26" cy="26" r="24" stroke-opacity=".38"/>
      <path d="M15 27l8 8 15-16"/>
      <circle cx="26" cy="116" r="24" stroke-opacity=".38"/>
      <path d="M15 117l8 8 15-16"/>
      <circle cx="26" cy="206" r="24" stroke-opacity=".38"/>
      <path d="M15 207l8 8 15-16"/>
    </g>
    <g fill="#fff" fill-opacity=".9">
      <rect x="72" y="18" width="210" height="16" rx="8"/>
      <rect x="72" y="108" width="168" height="16" rx="8"/>
      <rect x="72" y="198" width="238" height="16" rx="8"/>
    </g>
    <g fill="#fff" fill-opacity=".38">
      <rect x="72" y="44" width="132" height="11" rx="5.5"/>
      <rect x="72" y="134" width="196" height="11" rx="5.5"/>
      <rect x="72" y="224" width="150" height="11" rx="5.5"/>
    </g>
  </g>
</svg>
