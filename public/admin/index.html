<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- ⚠ 관리자 화면은 캐시하지 않는다.
     GitHub Pages 가 HTML 을 10분(max-age=600) 캐시하는데, 그 사이 배포하면
     브라우저가 옛 HTML 을 쓰고 그 안의 ?v= 도 옛것이라 JS 까지 옛 버전이 걸린다.
     실제로 고친 화면이 안 보인다는 문의가 세 번 있었다. 내부용 저트래픽 페이지라 손해가 없다. -->
<meta http-equiv="cache-control" content="no-store">
<link rel="stylesheet" href="../assets/css/style.css?v=20260821g">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css">
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
<style>
/* ============================================================
   MAKENOV 관리자 — 사이드바 셸 레이아웃
   ============================================================ */
:root{ --sb-w:236px; --adm-bg:#F6F7F9; --adm-line:#E5E8EB; --adm-ink:#191F28; --adm-sub:#8B95A1; }
body{background:var(--adm-bg);color:var(--adm-ink)}

/* ---------- 사이드바 ---------- */
.sb{position:fixed;top:0;left:0;bottom:0;width:var(--sb-w);background:#fff;border-right:1px solid var(--adm-line);
  display:flex;flex-direction:column;z-index:120;transition:transform .22s}
.sb-brand{padding:22px 20px 18px;border-bottom:1px solid var(--adm-line)}
.sb-brand .lg{font-size:21px;font-weight:800;letter-spacing:-.03em;color:var(--adm-ink)}
.sb-brand .lg b{color:var(--mk-primary)}
.sb-brand .role{display:inline-block;margin-top:7px;font-size:11px;font-weight:700;color:var(--mk-primary);
  background:var(--mk-primary-soft);border-radius:var(--r-pill);padding:3px 9px}
.sb-nav{flex:1;overflow-y:auto;padding:12px 12px 20px}
.sb-nav .grp{font-size:11px;font-weight:700;color:var(--adm-sub);letter-spacing:.04em;padding:14px 10px 7px}
.sb-nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 12px;
  border-radius:8px;font-size:14px;font-weight:600;color:#4E5968;margin-bottom:2px;transition:background .12s}
.sb-nav button .ico{width:18px;text-align:center;font-size:15px;flex-shrink:0}
.sb-nav button .cnt{margin-left:auto;font-size:11px;font-weight:700;background:var(--adm-bg);
  color:var(--adm-sub);border-radius:var(--r-pill);padding:2px 8px}
.sb-nav button:hover{background:var(--adm-bg)}
.sb-nav button.on{background:var(--mk-primary);color:#fff}
.sb-nav button.on .cnt{background:rgba(255,255,255,.24);color:#fff}
.sb-foot{padding:14px;border-top:1px solid var(--adm-line);display:flex;gap:8px}
.sb-foot a,.sb-foot button{flex:1;text-align:center;font-size:12px;font-weight:600;color:#4E5968;
  border:1px solid var(--adm-line);border-radius:6px;padding:9px 6px}
.sb-foot a:hover,.sb-foot button:hover{border-color:var(--adm-ink);color:var(--adm-ink)}

/* ---------- 본문 영역 ---------- */
.mainarea{margin-left:var(--sb-w);min-height:100vh;display:flex;flex-direction:column}
.topbar2{background:#fff;border-bottom:1px solid var(--adm-line);position:sticky;top:0;z-index:90;
  display:flex;align-items:center;gap:14px;padding:0 26px;height:62px}
.topbar2 h1{font-size:19px;font-weight:700;letter-spacing:-.02em}
.topbar2 .desc{font-size:13px;color:var(--adm-sub)}
.topbar2 .sp{flex:1}
.burger{display:none;font-size:20px;color:var(--adm-ink)}
.content{padding:24px 26px 60px;max-width:1180px;width:100%}

/* ---------- KPI ---------- */
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
@media(max-width:900px){.kpi{grid-template-columns:repeat(2,1fr)}}
.kpi-card{background:#fff;border:1px solid var(--adm-line);border-radius:12px;padding:18px 20px}
.kpi-card .lbl{font-size:12px;font-weight:600;color:var(--adm-sub);display:flex;align-items:center;gap:6px}
.kpi-card .num{font-size:28px;font-weight:800;letter-spacing:-.03em;margin-top:8px;line-height:1}
.kpi-card .sub{font-size:12px;color:var(--adm-sub);margin-top:7px}
.kpi-card .sub b{color:var(--mk-primary);font-weight:700}

/* ---------- 카드 ---------- */
.card{background:#fff;border:1px solid var(--adm-line);border-radius:12px;padding:20px 22px;margin-bottom:16px}
.card-head{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.card-head h3{font-size:16px;font-weight:700;letter-spacing:-.02em}
.card-head .sp{flex:1}
.note{font-size:13px;color:var(--adm-sub);margin-bottom:16px;line-height:1.75}
.note code{background:var(--adm-bg);padding:2px 6px;border-radius:4px;font-size:12px;color:#4E5968}
.note b{color:#4E5968}

/* ---------- 테이블 (가로 스크롤 격리) ---------- */
.tbl-wrap{overflow-x:auto;margin:0 -22px;padding:0 22px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
th{font-size:12px;font-weight:600;color:var(--adm-sub);text-align:left;padding:10px;
  border-bottom:1px solid var(--adm-line);white-space:nowrap;background:#fff}
td{padding:13px 10px;border-bottom:1px solid var(--adm-line);vertical-align:middle;color:var(--adm-ink)}
td .sub{font-size:12px;color:var(--adm-sub);margin-top:3px}
tbody tr:hover{background:#FAFBFC}
.empty-row td{text-align:center;color:var(--adm-sub);padding:44px;font-size:14px}

/* ---------- 폼 ---------- */
.bar{display:flex;align-items:center;gap:9px;margin-bottom:16px;flex-wrap:wrap}
.bar .grow{flex:1}
.srch{border:1px solid var(--adm-line);border-radius:7px;padding:9px 12px;font-size:13px;
  font-family:var(--font-body);min-width:200px;background:#fff;color:var(--adm-ink)}
.srch:focus{outline:none;border-color:var(--mk-primary)}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.fgrid.two{grid-template-columns:repeat(2,1fr)}
@media(max-width:900px){.fgrid,.fgrid.two{grid-template-columns:1fr}}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:13px;font-weight:600;color:#4E5968;margin-bottom:6px}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--adm-line);border-radius:7px;
  padding:10px 12px;font-size:14px;font-family:var(--font-body);background:#fff;color:var(--adm-ink)}
.fld textarea{resize:vertical;min-height:74px;line-height:1.7}
.fld input:focus,.fld textarea:focus,.fld select:focus{outline:none;border-color:var(--mk-primary);
  box-shadow:0 0 0 3px var(--mk-primary-soft)}
.fld .hint{font-size:12px;color:var(--adm-sub);margin-top:5px;line-height:1.6}
.lang-tag{display:inline-block;background:var(--adm-bg);color:var(--adm-sub);font-size:10px;
  font-weight:700;padding:2px 6px;border-radius:4px;margin-right:5px}
/* SEO 탭 글자수 — 짧으면 주황, 권장 범위면 초록, 길면 빨강 */
.seolen{float:right;font-size:11px;font-weight:600;color:var(--adm-sub)}
.seolen.ok{color:#0f9d58}
.seolen.warn{color:#b45309}
.seolen.over{color:#d93025}
.sect{border-top:1px solid var(--adm-line);margin-top:22px;padding-top:20px}
.sect h4{font-size:14px;font-weight:700;margin-bottom:14px}
/* 칼럼 안 FAQ 편집 블록 */
.cfaq{border:1px solid var(--adm-line);border-radius:10px;padding:16px 16px 14px;margin-bottom:12px;background:#FAFBFC}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:#4E5968;font-weight:500}
.chk input{width:auto}

/* ---------- 상세 블록 편집기 ---------- */
.blk{border:1px solid var(--adm-line);border-radius:10px;padding:14px;margin-bottom:11px;background:#FAFBFC}
.blk-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.blk-head b{font-size:12px;font-weight:700;color:var(--mk-primary)}
.blk-head .acts{display:flex;gap:5px}
.blk-head .acts button{font-size:12px;padding:4px 9px;border:1px solid var(--adm-line);
  border-radius:5px;background:#fff;color:#4E5968;font-weight:600}
.blk-head .acts button:hover:not([disabled]){border-color:var(--adm-ink)}
.blk-head .acts button[disabled]{opacity:.35}

/* ---------- 이미지 업로드 위젯 ---------- */
.upl{display:flex;gap:16px;align-items:flex-start;border:1px dashed var(--adm-line);
  border-radius:10px;padding:14px;background:#FAFBFC;transition:border-color .15s,background .15s}
.upl.over{border-color:var(--mk-primary);background:var(--mk-primary-soft)}
.upl-prev{width:176px;height:132px;flex-shrink:0;border-radius:8px;overflow:hidden;background:#fff;
  border:1px solid var(--adm-line);display:flex;align-items:center;justify-content:center}
.upl-prev img{width:100%;height:100%;object-fit:cover;display:block}
.upl-prev .ph{font-size:12px;color:var(--adm-sub)}
.upl-side{flex:1;min-width:0}
.upl-acts{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.upl-hint{font-size:12px;color:var(--adm-sub);line-height:1.65;margin:0}
.upl-url{margin-top:12px}
.upl-url summary{font-size:12px;color:var(--adm-sub);cursor:pointer;font-weight:600}
.upl-url summary::-webkit-details-marker{color:var(--adm-sub)}

/* ---------- 갤러리 ---------- */
.gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.gal-item{position:relative;border:1px solid var(--adm-line);border-radius:8px;overflow:hidden;background:#fff}
.gal-item img{width:100%;height:106px;object-fit:cover;display:block}
.gal-acts{display:flex;border-top:1px solid var(--adm-line)}
.gal-acts button{flex:1;font-size:11px;font-weight:600;color:#4E5968;padding:7px 2px;background:#fff}
.gal-acts button+button{border-left:1px solid var(--adm-line)}
.gal-acts button:hover:not([disabled]){background:var(--adm-bg)}
.gal-acts button[disabled]{opacity:.3}
.gal-first{position:absolute;top:7px;left:7px;font-size:10px;font-weight:700;color:#fff;
  background:var(--mk-primary);border-radius:4px;padding:3px 7px}

/* ---------- 저장공간 게이지 ---------- */
.bar-gauge{height:8px;border-radius:99px;background:var(--adm-bg);overflow:hidden;margin:10px 0 8px}
.bar-gauge i{display:block;height:100%;background:var(--mk-primary);border-radius:99px}
.bar-gauge i.warn{background:#F59F00}

/* ---------- 배지 ---------- */
.pill-st{display:inline-block;font-size:11px;font-weight:700;padding:4px 10px;border-radius:var(--r-pill)}
.st-new{background:var(--mk-primary-soft);color:var(--mk-primary-dark)}
.st-doing{background:#FFF4E0;color:#B7791F}
.st-done{background:#EEF1F4;color:#6B7684}
.st-vip{background:#E8F3FF;color:#1B64DA}
.thumb-sm{width:54px;height:41px;object-fit:cover;border-radius:6px;background:var(--adm-bg)}

/* ---------- 로그인 게이트 ---------- */
.login-wrap{max-width:380px;margin:0 auto;padding:100px 20px}
.login-wrap .lg{font-size:30px;font-weight:800;letter-spacing:-.03em;text-align:center;margin-bottom:6px}
.login-wrap .lg b{color:var(--mk-primary)}
.login-wrap .desc{font-size:14px;color:var(--adm-sub);text-align:center;margin-bottom:26px}

/* ---------- 유통 파트너 필터 칩 ---------- */
.bchips{display:flex;flex-wrap:wrap;gap:7px}
.bchip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:#4E5968;
  background:#fff;border:1px solid var(--adm-line);border-radius:var(--r-pill);padding:6px 12px;transition:all .12s}
.bchip:hover{border-color:var(--mk-primary)}
.bchip b{font-weight:700;color:var(--adm-sub)}
.bchip.on{background:var(--mk-primary);border-color:var(--mk-primary);color:#fff}
.bchip.on b{color:rgba(255,255,255,.85)}

/* ---------- 리치텍스트 에디터(Quill) ---------- */
.rte{background:#fff;border:1px solid var(--adm-line);border-radius:0 0 7px 7px}
.rte .ql-editor{min-height:170px;font-size:15px;line-height:1.8;font-family:var(--font-body);color:var(--adm-ink)}
.rte .ql-editor.ql-blank::before{color:var(--adm-sub);font-style:normal}
.ql-toolbar.ql-snow{border:1px solid var(--adm-line);border-radius:7px 7px 0 0;background:#FAFBFC}
.ql-container.ql-snow{border:0}
.rte .ql-editor img{max-width:100%;border-radius:8px}

.hidden{display:none!important}

/* ---------- 모바일 ---------- */
.sb-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:110;display:none}
@media(max-width:900px){
  .sb{transform:translateX(-100%);box-shadow:0 0 40px rgba(0,0,0,.14)}
  .sb.open{transform:translateX(0)}
  .sb-backdrop.open{display:block}
  .mainarea{margin-left:0}
  .burger{display:block}
  .content{padding:18px 16px 60px}
  .topbar2{padding:0 16px}
}

/* ---------- 카피 수정 — 한 줄 목록, 눌러서 펼치기 ---------- */
.cp-find{flex:1;min-width:280px;font-size:15px;padding:12px 14px}
.cp-group{font-size:12px;font-weight:700;color:var(--adm-sub);letter-spacing:.02em;
  margin:18px 0 7px;padding-bottom:6px;border-bottom:1px solid var(--adm-line)}
.cp-group:first-child{margin-top:4px}
.cp-group b{color:var(--mk-primary)}
.cp-item{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--adm-line);
  border-radius:8px;margin-bottom:6px;cursor:pointer;background:#fff;transition:border-color .12s,background .12s}
.cp-item:hover{border-color:var(--mk-primary);background:#FAFEFD}
.cp-item .tx{flex:1;font-size:14px;color:var(--adm-ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cp-item .wh{font-size:11px;color:var(--adm-sub);flex-shrink:0}
.cp-item .dot{font-size:10px;font-weight:700;color:#fff;background:var(--mk-primary);
  border-radius:var(--r-pill);padding:3px 8px;flex-shrink:0}
.cp-item.on{border-color:var(--mk-primary)}
.cp-item.open{display:block;cursor:default;padding:14px;background:#FAFBFC}
.cp-item.open .cp-head{display:flex;align-items:center;gap:10px;margin-bottom:11px;cursor:pointer}
.cp-item.open .cp-head .grow{flex:1}
.cp-item.open .fold{font-size:11px;color:var(--adm-sub)}
.cp-item.open textarea{width:100%;border:1px solid var(--adm-line);border-radius:7px;padding:9px 11px;
  font-size:14px;font-family:var(--font-body);line-height:1.6;resize:vertical;background:#fff;color:var(--adm-ink)}
.cp-item.open textarea:focus{outline:none;border-color:var(--mk-primary);box-shadow:0 0 0 3px var(--mk-primary-soft)}

/* ---------- 상세 보기 모달 (문의 · 유통 파트너) ---------- */
.adm-modal{position:fixed;inset:0;z-index:200;display:flex;align-items:flex-start;justify-content:center;
  padding:40px 20px;overflow:auto}
.adm-modal[hidden]{display:none}
.adm-modal .bg{position:fixed;inset:0;background:rgba(15,20,30,.42)}
.adm-modal .box{position:relative;width:100%;max-width:720px;background:#fff;border-radius:14px;
  box-shadow:0 18px 60px rgba(0,0,0,.22);overflow:hidden}
.adm-modal .hd{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--adm-line)}
.adm-modal .hd h3{font-size:16px;font-weight:700;margin:0}
.adm-modal .hd .x{margin-left:auto;border:0;background:none;font-size:20px;line-height:1;cursor:pointer;color:var(--adm-sub)}
.adm-modal .bd{padding:18px 20px 22px}
/* 정보 나열 — 라벨 왼쪽, 값 오른쪽 */
.dl{display:grid;grid-template-columns:104px 1fr;gap:8px 14px;font-size:13px;margin:0 0 16px}
.dl dt{color:var(--adm-sub)}
.dl dd{margin:0;color:var(--adm-ink);word-break:break-all}
.mbox{border:1px solid var(--adm-line);border-radius:9px;padding:13px 15px;margin-bottom:16px;background:#FAFBFC}
.mbox h4{font-size:13px;font-weight:700;margin:0 0 9px}
.msg{white-space:pre-wrap;font-size:13.5px;line-height:1.7;color:var(--adm-ink)}
.minilist{list-style:none;margin:0;padding:0;font-size:13px}
.minilist li{padding:8px 0;border-bottom:1px solid var(--adm-line);cursor:pointer}
.minilist li:last-child{border-bottom:0}
.minilist li:hover{color:var(--mk-primary)}
.minilist .sub{color:var(--adm-sub);font-size:12px}
@media(max-width:560px){ .dl{grid-template-columns:88px 1fr} .adm-modal{padding:16px 10px} }
</style>
