<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bảng xếp hạng | Cộng tác viên MAKENOV</title>
<meta name="description" content="Top cộng tác viên, chiến dịch nhiều khách hàng và tỷ lệ duyệt cao trong tháng trên MAKENOV.">
<link rel="stylesheet" href="../assets/css/style.css?v=20260909b">
<link rel="stylesheet" href="affiliate.css?v=20260909e">
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
</head>
<body class="aff-body">
<div class="aff-app">
  <aside class="aff-side" id="aff-side"></aside>
  <div class="aff-main">
    <div class="aff-top" id="aff-top"></div>
    <main class="aff-content">
      <div class="aff-sec-head"><h2>Bảng xếp hạng tháng này</h2><span class="more" id="rank-month"></span></div>
      <div class="aff-rank" id="rank-boxes"></div>
      <p class="aff-note">Tên cộng tác viên được ẩn một phần. Số liệu tính theo hoa hồng đã duyệt từ ngày 1 của tháng.</p>
    </main>
    <footer class="aff-foot" id="aff-foot"></footer>
  </div>
</div>
<script src="../assets/js/config.js?v=20260817b"></script>
<script src="aff-mock.js?v=20260909e"></script>
<script src="aff.js?v=20260909e"></script>
<script>
affBoot('rank', { title:'Bảng xếp hạng' }, async () => {
  const d = new Date(); document.getElementById('rank-month').textContent = `Tháng ${d.getMonth() + 1}/${d.getFullYear()}`;
  const rk = await AffApi.rankings();
  const box = (title, rows) => `<div class="box"><h3>${title}</h3>${rows.length ? `<ol>${rows.join('')}</ol>` : `<p class="aff-note">Chưa có dữ liệu</p>`}</div>`;
  document.getElementById('rank-boxes').innerHTML =
    box('Top cộng tác viên', rk.marketers.map(r => `<li><span class="r">${r.rank}</span><span class="nm">${esc(r.name)}</span><span class="v">${vnd(r.vnd)}</span></li>`)) +
    box('Chiến dịch nhiều khách hàng', rk.campaigns.map(r => `<li><span class="r">${r.rank}</span><a class="nm" href="campaign.html?id=${esc(r.product_id)}">${esc(r.name)}</a><span class="v">${r.leads}</span></li>`)) +
    box('Tỷ lệ duyệt cao', rk.approval.map(r => `<li><span class="r">${r.rank}</span><a class="nm" href="campaign.html?id=${esc(r.product_id)}">${esc(r.name)}</a><span class="v">${Math.round(r.rate * 100)}%</span></li>`));
});
</script>
</body>
</html>
