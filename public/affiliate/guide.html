<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hướng dẫn bắt đầu | Cộng tác viên MAKENOV</title>
<meta name="description" content="6 bước từ đăng ký đến lần rút tiền đầu tiên: chọn chiến dịch, lấy link, đăng lên Facebook, Zalo, TikTok, nhận hoa hồng khi khách hàng được duyệt.">
<link rel="canonical" href="https://vn.makenov.com/affiliate/guide.html">
<link rel="stylesheet" href="../assets/css/style.css?v=20260909b">
<link rel="stylesheet" href="affiliate.css?v=20260910f">
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
</head>
<body class="aff-body">
<div class="aff-app">
  <aside class="aff-side" id="aff-side"></aside>
  <div class="aff-main">
    <div class="aff-top" id="aff-top"></div>
    <main class="aff-content">
      <div class="g2-head"><h1 data-i18n="g2_title"></h1><p data-i18n="g2_sub"></p></div>

      <div class="g2-tl">
        <section class="g2-step"><span class="n">1</span><div class="h"><h2 data-i18n="g2_1h"></h2><span class="t" data-i18n="g2_1t"></span></div><p data-i18n="g2_1p"></p><div class="note" data-i18n="g2_1n"></div></section>
        <section class="g2-step"><span class="n">2</span><div class="h"><h2 data-i18n="g2_2h"></h2><span class="t" data-i18n="g2_2t"></span></div><p data-i18n="g2_2p"></p><div class="note" data-i18n="g2_2n"></div></section>
        <section class="g2-step"><span class="n">3</span><div class="h"><h2 data-i18n="g2_3h"></h2><span class="t" data-i18n="g2_3t"></span></div><p data-i18n="g2_3p"></p><div class="note warn" data-i18n="g2_3n"></div></section>
        <section class="g2-step"><span class="n">4</span><div class="h"><h2 data-i18n="g2_4h"></h2><span class="t" data-i18n="g2_4t"></span></div>
          <div class="g2-ch">
            <div class="c"><span class="lg fb">Facebook</span><h3 data-i18n="g2_4fb_h"></h3><p data-i18n="g2_4fb"></p><div class="x" data-i18n="g2_4fb_x"></div></div>
            <div class="c"><span class="lg zalo">Zalo</span><h3 data-i18n="g2_4zl_h"></h3><p data-i18n="g2_4zl"></p><div class="x" data-i18n="g2_4zl_x"></div></div>
            <div class="c"><span class="lg tt">TikTok</span><h3 data-i18n="g2_4tt_h"></h3><p data-i18n="g2_4tt"></p><div class="x" data-i18n="g2_4tt_x"></div></div>
          </div></section>
        <section class="g2-step"><span class="n">5</span><div class="h"><h2 data-i18n="g2_5h"></h2><span class="t" data-i18n="g2_5t"></span></div><p data-i18n="g2_5p"></p><div class="note warn" data-i18n="g2_5n"></div></section>
        <section class="g2-step"><span class="n">6</span><div class="h"><h2 data-i18n="g2_6h"></h2><span class="t" data-i18n="g2_6t"></span></div><p data-i18n="g2_6p"></p><div class="note" data-i18n="g2_6n"></div></section>
      </div>

      <section class="aff-sec">
        <div class="aff-sec-head"><h2 data-i18n="g2_tip_h"></h2></div>
        <div class="aff-stats three">
          <div class="aff-stat step"><span class="n">✓</span><p data-i18n="g2_t1"></p></div>
          <div class="aff-stat step"><span class="n">✓</span><p data-i18n="g2_t2"></p></div>
          <div class="aff-stat step"><span class="n">✓</span><p data-i18n="g2_t3"></p></div>
        </div>
      </section>

      <section class="aff-final">
        <h2 data-i18n="lp_final"></h2>
        <p data-i18n="lp_final_p"></p>
        <div class="cta" id="final-cta"></div>
      </section>
    </main>
    <footer class="aff-foot" id="aff-foot"></footer>
  </div>
</div>
<script src="../assets/js/config.js?v=20260817b"></script>
<script src="aff-i18n.js?v=20260910f"></script>
<script src="aff-api.js?v=20260910f"></script>
<script src="aff.js?v=20260910f"></script>
<script>
affBoot('guide', { titleKey:'menu_guide' }, () => {
  const m = AffApi.session();
  document.getElementById('final-cta').innerHTML = m
    ? `<a class="btn btn-primary btn-lg" href="campaigns.html">${t('g2_cta')}</a>`
    : `<a class="btn btn-primary btn-lg" href="join.html">${t('g2_cta_join')}</a><a class="btn btn-ghost btn-lg" href="campaigns.html">${t('g2_cta')}</a>`;
});
</script>
</body>
</html>
