<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chia sẻ | Cộng tác viên MAKENOV</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../assets/css/style.css?v=20260909b">
<link rel="stylesheet" href="affiliate.css?v=20260910i">
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
</head>
<body class="aff-body">
<div class="aff-app">
  <aside class="aff-side" id="aff-side"></aside>
  <div class="aff-main">
    <div class="aff-top" id="aff-top"></div>
    <main class="aff-content" id="root"></main>
    <footer class="aff-foot" id="aff-foot"></footer>
  </div>
</div>
<script src="../assets/js/config.js?v=20260817b"></script>
<script src="aff-i18n.js?v=20260910i"></script>
<script src="aff-api.js?v=20260910i"></script>
<script src="aff.js?v=20260910i"></script>
<script>
/* 텐핑 '소문내기' 구조: 요약 카드 → 공유 → 큰 CTA → [이미지·예시 글 | 주의사항] */
let C = null;
function ctaBlock(){
  const m = AffApi.session();
  const next = encodeURIComponent('campaign.html?id=' + C.product_id);
  if(!m) return `<a class="btn btn-primary" href="login.html?next=${next}">${t('cta_login')}</a><span class="note">${t('cta_no_acc', { join:'join.html?next=' + next })}</span>`;
  const link = affLink(m.code, C.product_id);
  return `<button class="btn btn-primary" onclick="copyText(${JSON.stringify(link)}, t('copied_link'))">${t('cta_copy')}</button>
    <div class="lk"><input readonly value="${esc(link)}" onclick="this.select()"><a class="btn btn-ghost" href="${esc(link)}" target="_blank" rel="noopener">${t('open')} ↗</a></div>
    <span class="note">${t('cta_note', { code: esc(m.code) })}</span>`;
}
affBoot('home', { titleKey:'cd_title', back:'index.html' }, async () => {
  const root = document.getElementById('root');
  C = await AffApi.campaign(qs('id'));
  if(!C){ root.innerHTML = `<div class="aff-empty">${t('not_found')}<br><a class="btn btn-primary" href="index.html" style="margin-top:16px">${t('see_campaigns')}</a></div>`; return; }
  document.title = `${cName(C)} | MAKENOV`;
  const mats = C.materials.length ? C.materials : [C.img];
  const left = C.remaining == null ? t('unlimited') : `${C.remaining} / ${C.cap}`;
  const m = AffApi.session();
  const postText = `${C.copy_text}\n\n${t('view_price')} ${affLink(m ? m.code : 'XXXXXX', C.product_id)}`;
  root.innerHTML = `
  <section class="aff-cd-head">
    <div class="th"><img src="${esc(C.img)}" alt="${esc(C.name)}"></div>
    <div>
      <div class="meta"><b>${esc(catName(C.cat))}</b><i>|</i>${esc(C.brand)} <span style="margin-left:8px">${rateChip(C.approval_rate)}</span></div>
      <h1>${esc(cName(C))}</h1>
      <p>${esc(C.headline || C.copy_text)}</p>
      <div class="bar"><a class="home" href="campaigns.html">‹ ${t('back_list')}</a><span class="sp"></span><a class="btn btn-ghost btn-sm" href="${AFF_HOST}/products/${esc(C.product_id)}.html" target="_blank" rel="noopener">${t('product_page')} ↗</a></div>
    </div>
  </section>
  <section class="aff-cd-cta">${ctaBlock()}</section>
  <div class="aff-cd-cols">
    <div class="aff-cd-col">
      <h2>${t('mats_h')}</h2>
      <div class="aff-cd-box">
        <p class="hint">${t('mats_hint')}</p>
        <div class="aff-mats">${mats.map((u, i) => `<figure><img src="${esc(u)}" alt="${esc(C.name)} ${i + 1}" loading="lazy"><figcaption><span>${t('img', { n: i + 1 })}</span><a href="${esc(u)}" download target="_blank" rel="noopener">${t('download')}</a></figcaption></figure>`).join('')}</div>
        <h3 style="margin-top:20px">${t('post_h')}</h3>
        <div class="aff-copybox">${esc(postText)}<button class="btn btn-primary btn-sm" onclick="copyText(${JSON.stringify(postText)}, t('copied_post'))">${t('copy')}</button></div>
        <p class="aff-note">${t('post_hint')}</p>
        <div class="aff-cd-info">
          <div><div class="lb">${t('info_cpa')}</div><div class="v mint">${vnd(C.cpa_vnd)}</div></div>
          <div><div class="lb">${t('info_left')}</div><div class="v">${left}</div></div>
          <div><div class="lb">${t('rate')}</div><div class="v">${C.approval_rate == null ? '—' : Math.round(C.approval_rate * 100) + '%'}</div></div>
        </div>
        <h3 style="margin-top:20px">${t('ap_h')}</h3>
        <table class="aff-table"><tbody>
          <tr><td>${t('ap_who')}</td><td class="num"><b>${t('ap_who_v')}</b></td></tr>
          <tr><td>${t('ap_rate')}</td><td class="num"><b>${C.approval_rate == null ? t('rate_na') : Math.round(C.approval_rate * 100) + '%'}</b> <span class="sub" style="display:inline">(${t('rate_n', { n: C.decided })})</span></td></tr>
          <tr><td>${t('ap_days')}</td><td class="num"><b>${C.avg_days == null ? '—' : t('ap_days_v', { d: C.avg_days })}</b></td></tr>
          <tr><td>${t('ap_ok')}</td><td class="num"><b>${C.approved}</b></td></tr>
        </tbody></table>
        <p class="aff-note">${t('ap_note')}</p>
      </div>
    </div>
    <div class="aff-cd-col">
      <h2>${t('notes_h')}</h2>
      <div class="aff-cd-box">
        <h3>${t('product_name')}</h3>
        <div class="aff-chips"><span class="name">${esc(C.name)}</span></div>
        <h3><span class="tip">${t('tip')}</span>${t('kw_h')}</h3>
        <p class="hint" style="margin-bottom:8px">${t('kw_hint')}</p>
        <div class="aff-chips">${(C.keywords || []).map(k => `<span onclick="copyText(${JSON.stringify('#' + k.replace(/\s+/g, ''))})">${esc(k)}</span>`).join('') || '<span class="name">—</span>'}</div>
        ${C.rules ? `<h3>${t('rules_camp')}</h3><p class="aff-rules">${esc(C.rules)}</p>` : ''}
        <h3>${t('rules_common')}</h3>
        <p class="aff-rules">${esc(t('rules_text'))}</p>
        <div class="aff-warn">${t('warn')}</div>
      </div>
    </div>
  </div>`;
});
</script>
</body>
</html>
