<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cộng tác viên MAKENOV | Một link, hoa hồng mỗi khách hàng</title>
<meta name="description" content="Chương trình cộng tác viên MAKENOV: đăng link sản phẩm lên TikTok, Facebook, Zalo. Nhận 150.000–250.000 ₫ cho mỗi cửa hàng, đại lý gửi yêu cầu báo giá và được duyệt. Không cần vốn.">
<link rel="canonical" href="https://vn.makenov.com/affiliate/">
<meta property="og:title" content="Cộng tác viên MAKENOV — một link, hoa hồng mỗi khách hàng">
<meta property="og:description" content="Đăng link lên TikTok, Facebook, Zalo. Nhận hoa hồng cho mỗi khách hàng được duyệt. Không cần vốn.">
<meta property="og:image" content="https://makenov.com/assets/img/og.png">
<link rel="stylesheet" href="../assets/css/style.css?v=20260909b">
<link rel="stylesheet" href="affiliate.css?v=20260909z">
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
</head>
<body class="aff-body">
<div class="aff-app">
  <aside class="aff-side" id="aff-side"></aside>
  <div class="aff-main">
    <div class="aff-top" id="aff-top"></div>
    <main class="aff-content">

      <!-- 1. 히어로 -->
      <section class="lp-hero">
        <div>
          <p class="kick" data-i18n="lp_kick"></p>
          <h1 data-i18n="lp_h1"></h1>
          <p data-i18n="lp_p"></p>
          <div class="cta" id="hero-cta"></div>
        </div>
        <div class="visual"><div class="pill" id="hero-pill"></div>
          <div class="hero-tiles" aria-hidden="true">
            <div class="tile t1"><span class="face"><svg viewBox="0 0 24 24"><path fill="#1877F2" d="M13.6 21v-7.3h2.5l.4-2.9h-2.9V9c0-.8.3-1.4 1.4-1.4h1.6V5.1c-.3 0-1.2-.1-2.3-.1-2.3 0-3.9 1.4-3.9 4v2.1H7.9v2.9h2.5V21h3.2z"/></svg></span></div>
            <div class="tile t2"><span class="face"><svg viewBox="0 0 24 24"><path fill="#161823" d="M13 2h3.1c.2 2 1.5 3.7 3.4 4.2v3.1c-1.2 0-2.4-.4-3.4-1v6.5c0 3.5-2.9 6.2-6.3 6.2S3.5 18.3 3.5 14.8s2.9-6.2 6.3-6.2c.3 0 .6 0 .9.1V12c-.3-.1-.6-.2-.9-.2-1.7 0-3.1 1.4-3.1 3s1.4 3 3.1 3 3.2-1.4 3.2-3V2z"/></svg></span></div>
            <div class="tile t3"><span class="face"><svg viewBox="0 0 24 24"><path fill="none" stroke="#161823" stroke-width="2.1" stroke-linecap="round" d="M15.6 9.6C15.1 8.3 13.9 7.5 12.3 7.5c-2.4 0-4 1.7-4 4.5s1.6 4.5 4 4.5c1.9 0 3.5-1.1 3.5-2.7 0-1.5-1.3-2.4-3.3-2.4-1.4 0-2.7.4-3.6 1.1"/><path fill="none" stroke="#161823" stroke-width="2.1" stroke-linecap="round" d="M12 3.2c5.4 0 8.2 3.5 8.2 8.8S17.4 20.8 12 20.8 3.8 17.3 3.8 12 6.6 3.2 12 3.2z"/></svg></span></div>
            <div class="tile t4"><span class="face"><svg viewBox="0 0 48 24"><text x="24" y="17.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-weight="900" font-size="15" fill="#0068FF" letter-spacing="-.5">Zalo</text></svg></span></div>
          </div></div>
      </section>

      <!-- 2. 숫자 4개 -->
      <div class="lp-kpis" id="kpis"></div>

      <!-- 3. 진행 순서 -->
      <section class="aff-sec">
        <div class="aff-sec-head"><h2 data-i18n="lp_how"></h2></div>
        <div class="aff-stats three">
          <div class="aff-stat step"><span class="n">1</span><h3 data-i18n="g_s1"></h3><p data-i18n="g_s1p"></p></div>
          <div class="aff-stat step"><span class="n">2</span><h3 data-i18n="g_s2"></h3><p data-i18n="g_s2p"></p></div>
          <div class="aff-stat step"><span class="n">3</span><h3 data-i18n="g_s3"></h3><p data-i18n="g_s3p"></p></div>
        </div>
      </section>

      <!-- 4. 열린 캠페인 -->
      <section class="aff-sec">
        <div class="aff-sec-head"><h2 data-i18n="lp_feat"></h2><a class="more" href="campaigns.html" data-i18n="lp_all"></a></div>
        <div class="aff-cards" id="featured"></div>
      </section>

      <!-- 5. 승인률 -->
      <section class="aff-sec">
        <div class="lp-rate">
          <div>
            <h2 data-i18n="lp_rate_h"></h2>
            <p data-i18n="lp_rate_p"></p>
            <div class="bar"><i class="g"></i><i class="r"></i></div>
            <div class="bar-lb"><span id="rate-lb-a"></span><span id="rate-lb-r"></span></div>
          </div>
          <div class="steps">
            <div class="st ok"><span class="ic">↑</span><div><b class="t" data-i18n="lp_rate_1"></b><span data-i18n="lp_rate_1p"></span></div></div>
            <div class="st no"><span class="ic">↓</span><div><b class="t" data-i18n="lp_rate_2"></b><span data-i18n="lp_rate_2p"></span></div></div>
            <div class="st gr"><span class="ic">★</span><div><b class="t" data-i18n="lp_rate_3"></b><span data-i18n="lp_rate_3p"></span></div></div>
          </div>
        </div>
      </section>

      <!-- 7. 랭킹 -->
      <section class="aff-sec">
        <div class="aff-sec-head"><h2 data-i18n="lp_rank"></h2><a class="more" href="rank.html" data-i18n="see_all"></a></div>
        <div class="aff-rank" id="rank-boxes"></div>
      </section>

      <!-- 8. FAQ -->
      <section class="aff-sec">
        <div class="aff-sec-head"><h2 data-i18n="lp_faq"></h2><a class="more" href="rules.html" data-i18n="menu_rules"></a></div>
        <div class="faq-list">
          <details class="faq-item"><summary data-i18n="q1"></summary><div class="a" data-i18n="a1"></div></details>
          <details class="faq-item"><summary data-i18n="q2"></summary><div class="a" data-i18n="a2"></div></details>
          <details class="faq-item"><summary data-i18n="q4"></summary><div class="a" data-i18n="a4"></div></details>
          <details class="faq-item"><summary data-i18n="q5"></summary><div class="a" data-i18n="a5"></div></details>
        </div>
      </section>

      <!-- 9. CTA -->
      <section class="aff-final">
        <h2 data-i18n="lp_final"></h2>
        <p data-i18n="lp_final_p"></p>
        <div class="cta" id="final-cta"></div>
      </section>
    </main>
    <footer class="aff-foot" id="aff-foot"></footer>
  </div>
</div>
<script src="../assets/js/config.js?v=20260817b"></script>
<script src="aff-i18n.js?v=20260909z"></script>
<script src="aff-api.js?v=20260909z"></script>
<script src="aff.js?v=20260909z"></script>
<script>
affBoot('home', { titleKey:'lp_kick' }, async () => {
  const m = AffApi.session();
  const ctas = m ? `<a class="btn btn-primary btn-lg" href="my.html">${t('lp_login_cta')}</a><a class="btn btn-ghost btn-lg" href="campaigns.html">${t('lp_cta2')}</a>`
                 : `<a class="btn btn-primary btn-lg" href="join.html">${t('lp_cta')}</a><a class="btn btn-ghost btn-lg" href="campaigns.html">${t('lp_cta2')}</a>`;
  document.getElementById('hero-cta').innerHTML = ctas; document.getElementById('final-cta').innerHTML = ctas;
  document.getElementById('rate-lb-a').textContent = t('lp_rate_1') + ' 82%'; document.getElementById('rate-lb-r').textContent = t('lp_rate_2') + ' 18%';
  const [all, rk] = await Promise.all([AffApi.campaigns({}), AffApi.rankings().catch(() => ({ marketers:[], campaigns:[], approval:[] }))]);
  const cpas = all.map(c => c.cpa_vnd), hi = cpas.length ? Math.max(...cpas) : 0;
  const rated = all.filter(c => c.approval_rate != null);
  const avgRate = rated.length ? Math.round(rated.reduce((a, c) => a + c.approval_rate, 0) / rated.length * 100) : null;
  document.getElementById('kpis').innerHTML = `
    <div class="lp-kpi"><div class="v">${all.length}<small>${t('lp_k1')}</small></div><div class="lb">${t('lp_feat')}</div></div>
    <div class="lp-kpi"><div class="v">${hi ? vnd(hi) : '—'}</div><div class="lb">${t('lp_k2')}</div></div>
    <div class="lp-kpi"><div class="v">${avgRate == null ? '—' : avgRate + '%'}</div><div class="lb">${t('lp_k3')}</div></div>
    <div class="lp-kpi"><div class="v" style="font-size:18px;padding-top:4px">${t('lp_k4v')}</div><div class="lb">${t('lp_k4')}</div></div>`;
  document.getElementById('hero-pill').innerHTML = hi ? `+ <b>${vnd(hi)}</b> ${t('per_lead').replace('/', '')}` : '';

  const feat = (all.filter(c => c.featured).length ? all.filter(c => c.featured) : all).slice(0, 3);
  document.getElementById('featured').innerHTML = feat.length ? feat.map(campaignCard).join('') : `<div class="aff-empty" style="grid-column:1/-1">${t('empty_list')}</div>`;


  const box = (title, rows) => `<div class="box"><h3>${title}</h3>${rows.length ? `<ol>${rows.join('')}</ol>` : `<p class="aff-note">${t('no_data')}</p>`}</div>`;
  document.getElementById('rank-boxes').innerHTML =
    box(t('rank_top'), rk.marketers.slice(0, 5).map(r => `<li><span class="r">${r.rank}</span><span class="nm">${esc(r.name)}</span><span class="v">${vnd(r.vnd)}</span></li>`)) +
    box(t('rank_camp'), rk.campaigns.slice(0, 5).map(r => `<li><span class="r">${r.rank}</span><a class="nm" href="campaign.html?id=${esc(r.product_id)}">${esc(cName(r))}</a><span class="v">${r.leads}</span></li>`)) +
    box(t('rank_rate'), rk.approval.slice(0, 5).map(r => `<li><span class="r">${r.rank}</span><a class="nm" href="campaign.html?id=${esc(r.product_id)}">${esc(cName(r))}</a><span class="v">${Math.round(r.rate * 100)}%</span></li>`));
});
</script>
</body>
</html>
