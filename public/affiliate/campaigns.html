<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chiến dịch | Cộng tác viên MAKENOV</title>
<meta name="description" content="Chương trình cộng tác viên MAKENOV: chọn chiến dịch sản phẩm Hàn Quốc, lấy link riêng, đăng lên TikTok, Facebook, Zalo và nhận hoa hồng cho mỗi khách hàng được duyệt.">
<link rel="canonical" href="https://vn.makenov.com/affiliate/campaigns.html">
<meta property="og:title" content="Cộng tác viên MAKENOV — kiếm hoa hồng khi giới thiệu sản phẩm Hàn Quốc">
<meta property="og:description" content="Đăng link lên TikTok, Facebook, Zalo. Nhận hoa hồng cho mỗi khách hàng được duyệt. Không cần vốn.">
<meta property="og:image" content="https://makenov.com/assets/img/og.png">
<link rel="stylesheet" href="../assets/css/style.css?v=20260909b">
<link rel="stylesheet" href="affiliate.css?v=20260909j">
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
</head>
<body class="aff-body">
<div class="aff-app">
  <aside class="aff-side" id="aff-side"></aside>
  <div class="aff-main">
    <div class="aff-top" id="aff-top"></div>
    <main class="aff-content">
      <div class="aff-tabs" id="tabs"></div>
      <div class="aff-list" id="list"></div>
    </main>
    <footer class="aff-foot" id="aff-foot"></footer>
  </div>
</div>
<script src="../assets/js/config.js?v=20260817b"></script>
<script src="aff-i18n.js?v=20260909j"></script>
<script src="aff-api.js?v=20260909j"></script>
<script src="aff.js?v=20260909j"></script>
<script>
let cat = qs('cat') || '', sort = 'cpa', q = '', ALL = [];
function setCat(c){ cat = c; draw(); }
function setSort(s){ sort = s; draw(); }
function setQ(v){ q = v.trim().toLowerCase(); draw(); }
function draw(){
  const all = ALL.slice().sort((a, b) => sort === 'new' ? b.sort - a.sort : b.cpa_vnd - a.cpa_vnd);
  const cats = AFF_CATS.filter(c => all.some(x => x.cat === c));
  document.getElementById('tabs').innerHTML =
    `<button class="${!cat ? 'on' : ''}" onclick="setCat('')">${t('all')} <span class="n">${all.length}</span></button>` +
    cats.map(c => `<button class="${cat === c ? 'on' : ''}" onclick="setCat('${c}')">${esc(catName(c))}</button>`).join('') +
    `<span class="sp"></span><select onchange="setSort(this.value)"><option value="cpa" ${sort === 'cpa' ? 'selected' : ''}>${t('sort_cpa')}</option><option value="new" ${sort === 'new' ? 'selected' : ''}>${t('sort_new')}</option></select>`;
  let list = cat ? all.filter(c => c.cat === cat) : all;
  if(q) list = list.filter(c => (c.name + ' ' + c.brand + ' ' + (c.headline || '')).toLowerCase().includes(q));
  document.getElementById('list').innerHTML = list.length ? list.map(campaignRow).join('') : `<div class="aff-empty">${t('empty_list')}</div>`;
}
affBoot('campaigns', { titleKey:'menu_campaigns', mid:`<div class="aff-search"><input type="search" placeholder="${t('search_ph')}" oninput="setQ(this.value)"></div>` }, async () => {
  ALL = await AffApi.campaigns({});
  draw();
});
</script>
</body>
</html>
